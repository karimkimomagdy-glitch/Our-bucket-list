<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Our Little Bucket List ❤️</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap');

  :root {
    --cream: #FBF6EF;
    --cream-deep: #F2E8DC;
    --white: #FFFFFF;
    --pink: #F3D9DC;
    --pink-deep: #E3AAB4;
    --beige: #E9D9C4;
    --burgundy: #7A2E3B;
    --burgundy-soft: #A15D68;
    --brown: #4A372C;
    --brown-soft: #8B7160;
    --shadow: 0 10px 26px -14px rgba(74,55,44,0.22);
    --shadow-lg: 0 20px 44px -18px rgba(74,55,44,0.28);
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; width:100%; }
  body {
    font-family: 'Manrope', sans-serif;
    background: var(--cream);
    color: var(--brown);
    min-height: 100vh;
    position: relative;
    padding-bottom: calc(90px + env(safe-area-inset-bottom, 0px));
  }
  h1,h2,h3,h4 { font-family:'Cormorant Garamond',serif; margin:0; color: var(--brown); overflow-wrap: break-word; }
  p { margin:0; overflow-wrap: break-word; }
  button { font-family: inherit; cursor:pointer; touch-action: manipulation; }
  select, input, textarea { font-family: inherit; }
  a { color: inherit; }
  img { max-width:100%; display:block; }

  .bl-loading { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; height:100vh; color: var(--burgundy); }
  .bl-loading-heart { font-size: 34px; animation: bl-pulse 1.2s ease-in-out infinite; }
  @keyframes bl-pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.18);} }

  /* ---------- Nav ---------- */
  .bl-topnav { position: sticky; top:0; z-index:30; background: rgba(251,246,239,0.88); backdrop-filter: blur(10px); border-bottom:1px solid rgba(74,55,44,0.08); display:none; }
  .bl-topnav-inner { max-width: 960px; margin:0 auto; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; }
  .bl-brand { font-family:'Cormorant Garamond',serif; font-weight:600; font-size:18px; display:flex; align-items:center; gap:7px; }
  .bl-brand-heart { color: var(--burgundy); }
  .bl-topnav-links { display:flex; gap:4px; }
  .bl-navlink { background:none; border:none; padding:8px 16px; border-radius:999px; color:var(--brown-soft); font-size:14px; font-weight:600; transition:.2s; }
  .bl-navlink:hover { background: var(--pink); color: var(--burgundy); }
  .bl-navlink.is-active { background: var(--burgundy); color:white; }

  @media (min-width: 780px) {
    .bl-topnav { display:block; }
    .bl-bottomnav { display:none !important; }
    body { padding-bottom:0; }
  }

  .bl-bottomnav { position:fixed; bottom:0; left:0; right:0; z-index:30; background: rgba(255,255,255,0.94); backdrop-filter: blur(14px); border-top:1px solid rgba(74,55,44,0.08); display:flex; justify-content:space-around; padding:8px 4px calc(10px + env(safe-area-inset-bottom, 0px)); }
  .bl-bottomlink { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; background:none; border:none; color:var(--brown-soft); font-size:10.5px; font-weight:600; padding:6px 10px; border-radius:12px; min-width:56px; min-height:48px; }
  .bl-bottomlink.is-active { color: var(--burgundy); background: var(--pink); }
  .bl-bottomlink .bl-nav-icon { font-size:19px; line-height:1; }

  .bl-fab { position: fixed; right: 18px; bottom: calc(94px + env(safe-area-inset-bottom, 0px)); width:58px; height:58px; border-radius:50%; background: var(--burgundy); color:white; border:none; display:flex; align-items:center; justify-content:center; box-shadow: 0 10px 24px -8px rgba(122,46,59,0.55); z-index: 40; transition: transform .2s ease; font-size: 27px; }
  .bl-fab:active { transform: scale(0.94); }
  @media (min-width:780px) {
    .bl-fab { bottom: 28px; }
    .bl-fab:hover { transform: scale(1.08) rotate(90deg); }
  }

  /* ---------- Layout ---------- */
  .bl-main { max-width: 960px; margin:0 auto; padding: 0 16px; width:100%; }
  .bl-page { padding: 22px 0 40px; }
  .bl-page-head { display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:16px; }
  .bl-page-title { font-size: 28px; }

  /* ---------- Hero ---------- */
  .bl-hero { text-align:center; padding: 40px 14px 30px; border-radius: 26px; background: linear-gradient(180deg, var(--cream-deep), var(--cream)); margin-top:14px; }
  .bl-eyebrow { display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color: var(--burgundy); background:white; padding:6px 13px; border-radius:999px; box-shadow: var(--shadow); }
  .bl-hero h1 { font-size:38px; line-height:1.1; margin-top:16px; font-weight:600; }
  .bl-heart-accent { display:inline-block; animation: bl-pulse 1.6s ease-in-out infinite; }
  .bl-hero-sub { display:block; max-width:420px; margin:14px auto 20px; color:var(--brown-soft); font-size:14.5px; line-height:1.5; }
  .bl-hero-actions { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  @media (min-width:640px) { .bl-hero h1 { font-size:54px; } .bl-hero-sub { font-size:15px; } }

  .bl-visited-counter { display:inline-flex; align-items:center; gap:6px; margin-top:18px; background:white; border:none; padding:10px 18px; border-radius:999px; box-shadow: var(--shadow); font-size:13.5px; font-weight:700; color:var(--brown); transition: transform .15s ease, box-shadow .15s ease; }
  .bl-visited-counter:active { transform: scale(0.96); }
  .bl-visited-counter .bl-visited-num { color: var(--burgundy); font-weight:800; }

  /* ---------- Home section cards ---------- */
  .bl-section-grid { display:grid; grid-template-columns: 1fr; gap:14px; margin-top: 26px; }
  @media (min-width:640px) { .bl-section-grid { grid-template-columns: repeat(3,1fr); } }
  .bl-section-card { background:white; border-radius:20px; padding:16px; box-shadow: var(--shadow); cursor:pointer; transition: transform .2s ease, box-shadow .2s ease; overflow:hidden; }
  .bl-section-card:active { transform: scale(0.985); }
  @media (min-width:780px) { .bl-section-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); } }
  .bl-section-card-head { display:flex; align-items:center; gap:10px; min-width:0; }
  .bl-section-icon { font-size: 26px; flex-shrink:0; }
  .bl-section-card-head-text { min-width:0; flex:1; }
  .bl-section-card-head h3 { font-size:18px; overflow-wrap:anywhere; }
  .bl-section-card-head p { font-size:12px; color:var(--brown-soft); font-weight:600; }
  .bl-section-preview { display:flex; gap:6px; margin-top:12px; flex-wrap:wrap; }
  .bl-photo.bl-preview-photo { width:44px; height:44px; min-width:44px; border-radius:12px; flex-shrink:0; }
  .bl-preview-empty { font-size:12px; color:var(--brown-soft); font-style:italic; align-self:center; }

  /* ---------- Photo base ---------- */
  .bl-photo { position:relative; display:flex; align-items:center; justify-content:center; width:100%; max-width:100%; overflow:hidden; background-color: var(--cream-deep); }
  .bl-photo-icon { font-size: 30px; }

  /* ---------- Wishlist grid ---------- */
  .bl-grid { display:grid; grid-template-columns: repeat(auto-fill,minmax(min(240px,100%),1fr)); gap:16px; margin-top:16px; }
  .bl-card { background:white; border-radius:18px; overflow:hidden; box-shadow: var(--shadow); cursor:pointer; transition: transform .22s ease, box-shadow .22s ease; position:relative; max-width:100%; }
  .bl-card:active { transform: scale(0.99); }
  @media (min-width:780px) { .bl-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); } }
  .bl-card-photo { height:130px; }
  .bl-status-chip { position:absolute; bottom:9px; left:9px; background: rgba(255,255,255,0.92); font-size:11px; font-weight:700; padding:4px 9px; border-radius:999px; color:var(--brown); max-width: calc(100% - 18px); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bl-card-body { padding:12px 14px 6px; min-width:0; }
  .bl-card-body h3 { font-size:18px; overflow-wrap:anywhere; }
  .bl-cat-icon { font-size:14px; }
  .bl-card-loc { display:flex; align-items:center; gap:4px; font-size:12px; color:var(--brown-soft); font-weight:600; margin-top:4px; overflow-wrap:anywhere; }
  .bl-card-foot { display:flex; align-items:center; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .bl-combined { font-size:11.5px; font-weight:700; color: var(--burgundy); }
  .bl-card-actions { display:flex; justify-content:flex-end; gap:6px; padding:8px 12px 12px; }
  .bl-icon-btn { background: var(--cream-deep); border:none; border-radius:10px; width:34px; height:34px; display:flex; align-items:center; justify-content:center; color:var(--brown-soft); transition:.2s; font-size:14px; flex-shrink:0; }
  .bl-icon-btn:active { background: var(--pink); color: var(--burgundy); }

  /* ---------- Hearts ---------- */
  .bl-hearts { display:inline-flex; gap:3px; flex-wrap:wrap; }
  .bl-heart { color:#E7D9CE; transition: transform .15s ease, color .15s ease; line-height:1; display:inline-flex; align-items:center; justify-content:center; background:none; border:none; padding:4px; min-width:28px; min-height:28px; }
  .bl-heart svg { display:block; }
  .bl-heart.is-filled { color: var(--burgundy); }
  .bl-heart.is-editable { cursor:pointer; }
  .bl-heart.is-editable:active { transform: scale(1.25); }

  /* ---------- Buttons ---------- */
  .bl-btn { display:inline-flex; align-items:center; justify-content:center; gap:7px; border-radius:999px; padding:11px 18px; font-size:13.5px; font-weight:700; border:none; transition:.2s; min-height:42px; }
  .bl-btn-primary { background: var(--burgundy); color:white; box-shadow: 0 8px 18px -8px rgba(122,46,59,0.5); }
  .bl-btn-primary:active { background:#682632; transform: scale(0.98); }
  .bl-btn-primary:disabled { opacity:.5; cursor:not-allowed; transform:none; }
  .bl-btn-ghost { background: var(--cream-deep); color: var(--brown); }
  .bl-btn-ghost:active { background:#e7dac8; }
  .bl-btn-danger { background:#C25454; color:white; }
  .bl-btn-danger.bl-btn-outline { background:white; color:#C25454; border:1px solid #eecccc; }
  .bl-btn-lg { padding:13px 24px; font-size:14.5px; }
  .bl-btn-sm { padding:8px 13px; font-size:12px; min-height:36px; }

  /* ---------- Tabs & search ---------- */
  .bl-tabs-row { display:flex; align-items:center; gap:8px; margin-top:4px; }
  .bl-tabs { display:flex; gap:8px; flex:1; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .bl-tabs::-webkit-scrollbar { display:none; }
  .bl-tab { background: var(--cream-deep); border:none; padding:9px 16px; border-radius:999px; font-size:13px; font-weight:700; color: var(--brown-soft); flex-shrink:0; min-height:38px; }
  .bl-tab.is-active { background: var(--burgundy); color:white; }
  .bl-search-toggle { flex-shrink:0; background:white; border:none; width:38px; height:38px; border-radius:50%; box-shadow: var(--shadow); font-size:15px; display:flex; align-items:center; justify-content:center; color: var(--burgundy); }
  .bl-search-row { display:flex; align-items:center; gap:8px; background:white; border-radius:999px; padding:6px 8px 6px 16px; box-shadow: var(--shadow); margin-top:12px; color:var(--brown-soft); animation: bl-search-in .18s ease; }
  @keyframes bl-search-in { from{ opacity:0; transform: translateY(-4px);} to{opacity:1; transform:translateY(0);} }
  .bl-search-row input { border:none; outline:none; background:none; flex:1; font-size:16px; min-width:0; color: var(--brown); }
  .bl-search-close { flex-shrink:0; background: var(--cream-deep); border:none; width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--brown-soft); font-size:13px; }

  /* ---------- Empty state ---------- */
  .bl-empty { text-align:center; padding:52px 18px; color:var(--brown-soft); display:flex; flex-direction:column; align-items:center; gap:12px; }
  .bl-empty .bl-empty-icon { font-size: 30px; color: var(--pink-deep); }
  .bl-empty p { font-family:'Cormorant Garamond',serif; font-size:20px; font-style:italic; color: var(--brown); }

  /* ---------- Modals ---------- */
  .bl-overlay { position:fixed; inset:0; background: rgba(74,55,44,0.35); backdrop-filter: blur(3px); z-index:100; display:flex; align-items:center; justify-content:center; padding:14px; }
  .bl-modal { background: var(--cream); border-radius:22px; width:min(560px,100%); max-width:100%; max-height:88vh; overflow-y:auto; box-shadow: var(--shadow-lg); }
  .bl-modal-head { display:flex; justify-content:space-between; align-items:center; padding:16px 18px; border-bottom:1px solid rgba(74,55,44,0.08); position:sticky; top:0; background:var(--cream); z-index:2; }
  .bl-close-btn { background:white; border:none; border-radius:50%; width:34px; height:34px; display:flex; align-items:center; justify-content:center; box-shadow: var(--shadow); font-size:15px; flex-shrink:0; }

  .bl-form { padding:16px 18px 22px; display:flex; flex-direction:column; gap:14px; max-width:100%; }
  .bl-field { display:flex; flex-direction:column; gap:6px; font-size:12px; font-weight:700; color:var(--brown-soft); min-width:0; }
  .bl-field input, .bl-field select, .bl-field textarea { border:1px solid rgba(74,55,44,0.15); border-radius:12px; padding:11px 12px; font-size:16px; color:var(--brown); background:white; resize:vertical; max-width:100%; width:100%; }
  .bl-field input:focus, .bl-field select:focus, .bl-field textarea:focus { outline:2px solid var(--pink-deep); outline-offset:1px; }
  .bl-toggle-row { display:flex; gap:8px; }
  .bl-toggle { flex:1; background:white; border:1px solid rgba(74,55,44,0.15); border-radius:12px; padding:10px; font-size:13.5px; font-weight:700; color:var(--brown-soft); min-height:42px; }
  .bl-toggle.is-active { background: var(--burgundy); color:white; border-color: var(--burgundy); }
  .bl-form-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:6px; flex-wrap:wrap; }

  /* ---------- Photo upload ---------- */
  .bl-cover-preview { position:relative; width:100%; height:130px; border-radius:14px; background-size:cover; background-position:center; overflow:hidden; background-color: var(--cream-deep); }
  .bl-upload-btn { align-self:flex-start; }
  .bl-photo-remove-btn { position:absolute; top:7px; right:7px; width:28px; height:28px; border-radius:50%; background:rgba(74,55,44,0.72); color:white; border:none; font-size:13px; display:flex; align-items:center; justify-content:center; }
  .bl-memory-photos-grid { display:flex; flex-wrap:wrap; gap:8px; margin-top:2px; }
  .bl-memory-photo-thumb { position:relative; width:68px; height:68px; border-radius:12px; background-size:cover; background-position:center; box-shadow: var(--shadow); flex-shrink:0; background-color: var(--cream-deep); }
  .bl-photo-add-tile { width:68px; height:68px; border-radius:12px; border:1.5px dashed rgba(122,46,59,0.35); background: var(--cream-deep); color: var(--burgundy-soft); display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:17px; gap:2px; flex-shrink:0; }
  .bl-photo-add-tile span { font-size:9px; font-weight:700; }

  /* ---------- Detail ---------- */
  .bl-detail { background: var(--cream); border-radius:22px; width:min(560px,100%); max-width:100%; max-height:90vh; overflow-y:auto; box-shadow: var(--shadow-lg); position:relative; }
  .bl-detail-photo { height:190px; }
  .bl-detail-body { padding:20px 18px 26px; min-width:0; }
  .bl-detail-body h2 { font-size:26px; overflow-wrap:anywhere; }
  .bl-detail-loc { display:flex; align-items:center; gap:5px; font-size:13px; color:var(--brown-soft); font-weight:600; margin-top:6px; flex-wrap:wrap; }
  .bl-detail-why { font-style:italic; color:var(--brown-soft); margin-top:12px; font-size:14.5px; }
  .bl-section { margin-top:22px; }
  .bl-section h4 { font-size:12px; text-transform:uppercase; letter-spacing:.04em; color: var(--burgundy); display:flex; align-items:center; gap:6px; margin-bottom:10px; font-family:'Manrope',sans-serif; }
  .bl-exc-grid { display:grid; grid-template-columns: repeat(auto-fit,minmax(min(120px,100%),1fr)); gap:14px; background:white; border-radius:16px; padding:14px; box-shadow: var(--shadow); }
  .bl-person-label { display:block; font-size:11.5px; font-weight:700; color:var(--brown-soft); margin-bottom:5px; }
  .bl-combined-box { display:flex; flex-direction:column; justify-content:center; }
  .bl-combined-box strong { font-family:'Cormorant Garamond',serif; font-size:20px; color: var(--burgundy); }
  .bl-memory-box { background:white; border-radius:16px; padding:16px; box-shadow: var(--shadow); display:flex; flex-direction:column; gap:14px; }
  .bl-detail-actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:24px; }

  /* ---------- Map ---------- */
  .bl-map-legend { display:flex; gap:12px; flex-wrap:wrap; margin:14px 0; font-size:12px; font-weight:600; color:var(--brown-soft); }
  .bl-map-frame { position:relative; width:100%; max-width:100%; aspect-ratio:16/10; background: linear-gradient(160deg,#F6EEE3,#EDE0CC); border-radius:22px; overflow:hidden; box-shadow: var(--shadow); }
  .bl-map-bg { position:absolute; inset:0; width:100%; height:100%; }
  .bl-continent { fill:#E4D5BE; opacity:.8; }
  .bl-us-heart { fill: var(--burgundy); }
  .bl-us-heart-text { fill:white; font-weight:800; font-family:'Manrope',sans-serif; }
  /* The button's box IS the touch target, so it must match the visible icon
     exactly — nothing here should make the tappable area wider/taller than
     what's actually drawn (the tooltip below is taken out of flow for this
     reason). */
  .bl-map-pin { position:absolute; transform: translate(-50%,-100%); background:none; border:none; color: var(--burgundy); display:flex; align-items:center; justify-content:center; font-size:20px; width:40px; height:40px; padding:0; }
  .bl-pin-want { color:#9C7BC2; } .bl-pin-must { color:#C77E2D; } .bl-pin-planned { color:#5D82AD; } .bl-pin-visited { color: var(--burgundy); }
  .bl-map-pin span.bl-pin-icon { display:flex; filter: drop-shadow(0 3px 4px rgba(0,0,0,.2)); transition: transform .2s ease; }
  .bl-map-pin:active span.bl-pin-icon { transform: scale(1.25); }
  /* Positioned absolutely (out of flow) so its own width never affects the
     button's hit-box — that was the cause of taps registering on the wrong
     nearby marker. */
  .bl-pin-tip { position:absolute; left:50%; bottom:calc(100% + 4px); transform: translateX(-50%); opacity:0; pointer-events:none; background:white; color:var(--brown); font-size:10.5px; font-weight:700; padding:3px 7px; border-radius:7px; box-shadow: var(--shadow); white-space:nowrap; transition: opacity .2s ease; }
  @media (min-width:780px) { .bl-map-pin:hover .bl-pin-tip { opacity:1; } .bl-map-pin:hover span.bl-pin-icon { transform: scale(1.25); } }

  /* ---------- Memories ---------- */
  .bl-memories-grid { display:grid; grid-template-columns: repeat(auto-fill,minmax(min(260px,100%),1fr)); gap:16px; margin-top:16px; }
  .bl-memory-card { display:flex; gap:12px; background:white; border-radius:16px; padding:10px; box-shadow: var(--shadow); cursor:pointer; transition: transform .2s ease; max-width:100%; }
  .bl-memory-card:active { transform: scale(0.99); }
  .bl-memory-photo { width:80px; height:80px; min-width:80px; border-radius:12px; flex-shrink:0; }
  .bl-memory-body { min-width:0; }
  .bl-memory-body h3 { font-size:17px; overflow-wrap:anywhere; }
  .bl-memory-loc { font-size:11.5px; color:var(--brown-soft); font-weight:600; margin-top:2px; display:flex; align-items:center; gap:4px; }
  .bl-memory-date { font-size:11.5px; color:var(--brown-soft); font-weight:600; margin-top:2px; }
  .bl-memory-note { font-size:13px; font-style:italic; color:var(--brown-soft); margin-top:6px; }
  .bl-memory-photos-count { font-size:11px; color: var(--burgundy-soft); font-weight:700; margin-top:4px; }

  /* ---------- Surprise ---------- */
  .bl-surprise { background: var(--cream); border-radius:22px; padding:28px 22px; width:min(380px,100%); max-width:100%; text-align:center; position:relative; box-shadow: var(--shadow-lg); }
  .bl-surprise-label { font-weight:700; color: var(--burgundy); font-size:12.5px; text-transform:uppercase; letter-spacing:.04em; margin-bottom:14px; }
  .bl-surprise-reveal.is-spinning { animation: bl-spin-blur .11s linear infinite; }
  @keyframes bl-spin-blur { 0%{opacity:.6;} 50%{opacity:1;} 100%{opacity:.6;} }
  .bl-surprise-photo { height:140px; border-radius:16px; margin-bottom:12px; }
  .bl-surprise-reveal h2 { font-size:24px; }
  .bl-surprise-loc { font-size:12.5px; color:var(--brown-soft); font-weight:600; margin-top:4px; }
  .bl-surprise-reveal.is-settled { animation: bl-pop .4s ease; }
  @keyframes bl-pop { 0%{transform:scale(.9);} 60%{transform:scale(1.05);} 100%{transform:scale(1);} }
  .bl-surprise-actions { display:flex; gap:10px; justify-content:center; margin-top:18px; flex-wrap:wrap; }

  .bl-confirm { background: var(--cream); border-radius:20px; padding:22px; width:min(360px,100%); max-width:100%; box-shadow: var(--shadow-lg); }
  .bl-confirm-title { font-family:'Cormorant Garamond',serif; font-size:20px; font-weight:700; }
  .bl-confirm-body { color:var(--brown-soft); font-size:13px; margin-top:8px; }
  .bl-confirm-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:18px; flex-wrap:wrap; }

<script>
/* ================================================================ */
/*  Constants & data                                                  */
/* ================================================================ */

const CATEGORIES = [
  { id: "Food", label: "Food", icon: "🍽️" },
  { id: "Café", label: "Café", icon: "☕" },
  { id: "Entertainment", label: "Entertainment", icon: "🎬" },
  { id: "Date", label: "Date", icon: "❤️" },
  { id: "Nature", label: "Nature", icon: "🌳" },
  { id: "Beach", label: "Beach", icon: "🏖️" },
  { id: "Activity", label: "Activity", icon: "🎉" },
  { id: "Travel", label: "Travel", icon: "✈️" },
  { id: "Other", label: "Other", icon: "🌍" },
];
const CAT_MAP = Object.fromEntries(CATEGORIES.map(c => [c.id, c]));
const STATUS_LIST = [
  { id: "want", label: "Want to Go", icon: "💭" },
  { id: "must", label: "Must Go", icon: "🔥" },
  { id: "planned", label: "Planned", icon: "📅" },
  { id: "visited", label: "Visited", icon: "❤️" },
];
const STATUS_MAP = Object.fromEntries(STATUS_LIST.map(s => [s.id, s]));
const PALETTES = [
  ["#F3D9DC", "#E8B3BC"], ["#EFE4D2", "#E0C89A"], ["#DCE7E0", "#B7CFC0"],
  ["#E9DCEF", "#CBB3E0"], ["#F0E0D2", "#E0B79A"], ["#DCE2ED", "#B7C4DE"],
];

const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const avgExc = (e) => {
  const vals = [e && e.me, e && e.her].filter(v => typeof v === "number" && v > 0);
  if (!vals.length) return 0;
  return Math.round((vals.reduce((a, b) => a + b, 0) / vals.length) * 10) / 10;
};
const fmtDate = (iso) => {
  if (!iso) return "";
  try { return new Date(iso).toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" }); }
  catch (e) { return iso; }
};
const esc = (s) => (s || "").toString()
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

const seedPlace = (over) => Object.assign({
  id: uid(), name: "", location: "", photo: "", type: "local", category: "Date",
  why: "", excitement: { me: 0, her: 0 }, status: "want",
  createdAt: new Date().toISOString(), visitedDate: "",
  memory: { date: "", note: "", photos: [] },
  mapPos: { x: 50, y: 50 }, palette: 0,

const DEFAULT_PLACES = [
  seedPlace({ name: "The Garden Café", location: "Cairo", type: "local", category: "Café",

    why: "Just the two of us and the water at golden hour.",

    why: "That one movie we've both been wanting to see.",

  seedPlace({ name: "Santorini", location: "Greece", type: "travel", category: "Travel",
    why: "Watching the sunset together in Oia.",
    excitement: { me: 5, her: 5 }, status: "want", mapPos: { x: 56, y: 34 }, palette: 0 }),

    excitement: { me: 4, her: 5 }, status: "want", mapPos: { x: 87, y: 34 }, palette: 2 }),
  seedPlace({ name: "Rome", location: "Italy", type: "travel", category: "Travel",

    excitement: { me: 5, her: 5 }, status: "visited", visitedDate: "2027-06-14",

    mapPos: { x: 51, y: 32 }, palette: 4 }),
];

/* ================================================================ */
/*  State                                                             */
/* ================================================================ */

const state = {
  loading: true,
  places: [],
  view: "home",
  tab: "all",
  search: "",
  searchOpen: false,
  showAdd: false,
  editingId: null,

/* ================================================================ */
/*  Persistence                                                       */
/* ================================================================ */

// window.storage (used above) only exists inside the Claude.ai artifact
// preview — if this file is downloaded and opened directly, or hosted
// somewhere and reopened later, that API isn't there, so anything saved
// through it alone is lost on refresh. IndexedDB (with a localStorage
// fallback for browsers/contexts where IndexedDB is blocked) is real,
// built-in browser storage that survives a refresh AND fully closing and
// reopening the browser, so it's used as the authoritative local store.
// window.storage is still written to as well, best-effort, so syncing
// still works in the environments that do provide it.

const IDB_NAME = "our_little_bucket_list";
const IDB_STORE = "kv";
const LS_FALLBACK_KEY = "bl_places_fallback_v1";

function idbOpen() {
  return new Promise((resolve, reject) => {
    if (!window.indexedDB) { reject(new Error("IndexedDB unavailable")); return; }
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error || new Error("IndexedDB open failed"));
  });
}
async function idbGet(key) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, "readonly");
    const req = tx.objectStore(IDB_STORE).get(key);
    req.onsuccess = () => resolve(req.result === undefined ? null : req.result);
    req.onerror = () => reject(req.error || new Error("IndexedDB read failed"));
  });
}
async function idbSet(key, value) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, "readwrite");
    tx.objectStore(IDB_STORE).put(value, key);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error || new Error("IndexedDB write failed"));
  });
}
function lsGetFallback() {
  try {
    const raw = localStorage.getItem(LS_FALLBACK_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function lsSetFallback(list) {
  try { localStorage.setItem(LS_FALLBACK_KEY, JSON.stringify(list)); return true; }
  catch (e) { return false; }
}

async function loadPlaces() {
  let list = null;

  // 1) Reliable local store first — this is what actually survives a
  //    refresh / reopened browser in a normal (non-Claude.ai) context.
  try {
    const idbList = await idbGet("bl_places");
    if (idbList && Array.isArray(idbList) && idbList.length > 0) list = idbList;
  } catch (e) {}
  if (!list) {
    const lsList = lsGetFallback();
    if (lsList && Array.isArray(lsList) && lsList.length > 0) list = lsList;
  }

  // 2) If nothing local yet, fall back to window.storage (present inside
  //    the Claude.ai artifact preview) so existing data there isn't lost.
  if (!list) {
    try {
      const r = await window.storage.get("bl_places", true);
      const wsList = r ? JSON.parse(r.value) : null;
      if (wsList && Array.isArray(wsList) && wsList.length > 0) list = wsList;
    } catch (e) {}
  }

  // 3) Nothing saved anywhere yet — seed with the starter places.
  if (!list || !Array.isArray(list) || list.length === 0) {
    list = DEFAULT_PLACES;
  }

  // make sure older saved records still have a memory.photos array
  list = list.map(p => Object.assign({}, p, { memory: Object.assign({ date: "", note: "", photos: [] }, p.memory) }));
  state.places = list;
  state.loading = false;

  // Write the loaded/seeded data back to every store so they're all in
  // sync from the very first load.
  await persist(list);

  mountApp();
}

// Updates in-memory state + persists to storage. Does NOT trigger any
// rendering itself — callers decide exactly which part of the UI needs
// to redraw, so an unrelated data change never forces the map (or any
// other heavy view) to rebuild.
async function persist(list) {
  state.places = list;
  let savedLocally = false;
  try { await idbSet("bl_places", list); savedLocally = true; } catch (e) {}
  if (!savedLocally) lsSetFallback(list);
  try { await window.storage.set("bl_places", JSON.stringify(list), true); } catch (e) {}
}

/* ================================================================ */
/*  Image helpers (device photo picker → compressed data URL)         */
/* ================================================================ */

function readAndCompressImage(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    if (!file || !file.type || file.type.indexOf("image/") !== 0) { reject(new Error("Not an image")); return; }
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("Could not read file"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("Could not load image"));
      img.onload = () => {
        let width = img.width, height = img.height;
        if (width > maxDim || height > maxDim) {
          if (width > height) { height = Math.round(height * (maxDim / width)); width = maxDim; }
          else { width = Math.round(width * (maxDim / height)); height = maxDim; }
        }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function heartSvg(filled, size) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="${filled ? "currentColor" : "none"}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.5 4.04 3 5.5l7 7Z"/></svg>`;
}
const HEART_PATH_D = "M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.5 4.04 3 5.5l7 7Z";
function pinSvg(size) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>`;
}

function heartsRow(value, size, editable, groupName) {
  let out = `<div class="bl-hearts" data-hearts="${groupName || ''}">`;
  for (let i = 1; i <= 5; i++) {
    const filled = i <= value;
    out += `<button type="button" class="bl-heart ${filled ? "is-filled" : ""} ${editable ? "is-editable" : ""}" ${editable ? `data-action="set-heart" data-group="${groupName}" data-value="${i}"` : "tabindex=\"-1\" disabled"}>${heartSvg(filled, size)}</button>`;
  }
  out += `</div>`;
  return out;
}

/* ================================================================ */
/*  Small render helpers                                              */
/* ================================================================ */

function photoDiv(place, extraClass, innerHtml) {
  const pal = PALETTES[place.palette % PALETTES.length];
  const style = place.photo
    ? `background-image:url('${esc(place.photo)}');background-size:cover;background-position:center;`
    : `background:linear-gradient(135deg, ${pal[0]}, ${pal[1]});`;
  const icon = place.photo ? "" : `<span class="bl-photo-icon">${(CAT_MAP[place.category] || {}).icon || "🌍"}</span>`;
  return `<div class="bl-photo ${extraClass || ""}" style="${style}">${icon}${innerHtml || ""}</div>`;
}
function memoryPhotoDiv(place, extraClass) {
  const photos = (place.memory && place.memory.photos) || [];
  if (photos.length) {
    return `<div class="bl-photo ${extraClass || ""}" style="background-image:url('${esc(photos[0])}');background-size:cover;background-position:center;"></div>`;
  }
  return photoDiv(place, extraClass);
}

function statusChip(place) {
  const s = STATUS_MAP[place.status];
  return `<span class="bl-status-chip">${s.icon} ${s.label}</span>`;
}

/* ================================================================ */
/*  Cards                                                              */
/* ================================================================ */

function placeCard(place) {
  const status = STATUS_MAP[place.status];

  const combined = avgExc(place.excitement);
  return `
    <div class="bl-card" data-action="open-place" data-id="${place.id}">

      </div>

        <button class="bl-icon-btn" data-action="delete-place" data-id="${place.id}">🗑</button>
      </div>
    </div>`;
}

  return `
    <nav class="bl-bottomnav">
      ${NAV_ITEMS.map(n => `
        <button class="bl-bottomlink ${state.view === n.id ? "is-active" : ""}" data-action="set-view" data-view="${n.id}">
          <span class="bl-nav-icon">${n.icon}</span><span>${n.label}</span>
        </button>`).join("")}
    </nav>`;
}

/* ================================================================ */
/*  Form (add / edit)                                                 */
/* ================================================================ */

function placeForm(place, isEdit) {
  const f = place;
  return `
    <div class="bl-form">
      <label class="bl-field"><span>Place name *</span>
        <input id="f-name" value="${esc(f.name)}" placeholder="The Garden Café" />
      </label>
      <label class="bl-field"><span>Location *</span>
        <input id="f-location" value="${esc(f.location)}" placeholder="Cairo" />
      </label>
      <div class="bl-field">
        <span>Cover photo</span>
        ${f.photo ? `
          <div class="bl-cover-preview" style="background-image:url('${esc(f.photo)}');">
            <button type="button" class="bl-photo-remove-btn" data-action="remove-cover-photo" aria-label="Remove photo">✕</button>
          </div>` : `
          <button type="button" class="bl-btn bl-btn-ghost bl-btn-sm bl-upload-btn" data-action="pick-cover-photo">📷 Add Photo</button>`}
        <input type="file" id="f-photo-file" accept="image/*" style="display:none" />
      </div>
      <div class="bl-field">
        <span>Local or Travel</span>
        <div class="bl-toggle-row">
          <button type="button" class="bl-toggle ${f.type === "local" ? "is-active" : ""}" data-action="form-set-type" data-value="local">📍 Nearby</button>
          <button type="button" class="bl-toggle ${f.type === "travel" ? "is-active" : ""}" data-action="form-set-type" data-value="travel">✈️ Travel</button>
        </div>
      </div>
      <label class="bl-field"><span>Category</span>
        <select id="f-category">
          ${CATEGORIES.map(c => `<option value="${c.id}" ${f.category === c.id ? "selected" : ""}>${c.icon} ${c.label}</option>`).join("")}
        </select>
      </label>
      <label class="bl-field"><span>Status</span>
        <select id="f-status">
          ${STATUS_LIST.map(s => `<option value="${s.id}" ${f.status === s.id ? "selected" : ""}>${s.icon} ${s.label}</option>`).join("")}
        </select>
      </label>
      <label class="bl-field bl-field-wide"><span>Why we want to go</span>
        <textarea id="f-why" rows="2" placeholder="What makes this feel like us?">${esc(f.why)}</textarea>
      </label>
      <div class="bl-field"><span>My excitement</span>
        ${heartsRow(f.excitement.me, 22, true, "form-me")}
      </div>
      <div class="bl-field"><span>Ayoshy's excitement</span>
        ${heartsRow(f.excitement.her, 22, true, "form-her")}
      </div>
      <div class="bl-form-actions">
        <button class="bl-btn bl-btn-ghost" data-action="close-modal">Cancel</button>
        <button class="bl-btn bl-btn-primary" data-action="${isEdit ? "save-edit" : "save-new"}" ${(!f.name.trim() || !f.location.trim()) ? "disabled" : ""}>✓ Save place</button>
      </div>
    </div>`;
}

function addModal() {
  if (!state.showAdd) return "";
  return `
    <div class="bl-overlay" data-action="close-modal">
      <div class="bl-modal" data-stop="1">
        <div class="bl-modal-head"><h3>Add a Place</h3><button class="bl-close-btn" data-action="close-modal">✕</button></div>
        ${placeForm(state.formDraft, false)}
      </div>
    </div>`;
}
function editModal() {
  if (!state.editingId) return "";
  return `
    <div class="bl-overlay" data-action="close-modal">
      <div class="bl-modal" data-stop="1">
        <div class="bl-modal-head"><h3>Edit Place</h3><button class="bl-close-btn" data-action="close-modal">✕</button></div>
        ${placeForm(state.formDraft, true)}
      </div>
    </div>`;
}

/* ================================================================ */
/*  Detail modal                                                      */
/* ================================================================ */

function detailModal() {
  if (!state.selectedId) return "";
  const place = state.places.find(p => p.id === state.selectedId);
  if (!place) return "";
  const status = STATUS_MAP[place.status];
  const cat = CAT_MAP[place.category];
  const combined = avgExc(place.excitement);
  const md = state.memoryDraft || place.memory;
  const photos = md.photos || [];

  return `
    <div class="bl-overlay" data-action="close-detail">
      <div class="bl-detail" data-stop="1">
        <button class="bl-close-btn" data-action="close-detail" style="position:absolute;top:12px;right:12px;z-index:2;">✕</button>
        ${photoDiv(place, "bl-detail-photo", statusChip(place))}
        <div class="bl-detail-body">
          <h2>${esc(place.name)} <span class="bl-cat-icon">${cat ? cat.icon : ""}</span></h2>
          <p class="bl-detail-loc">${pinSvg(13)} ${esc(place.location)} · ${place.type === "local" ? "📍 Nearby" : "✈️ Travel"}</p>
          ${place.why ? `<p class="bl-detail-why">"${esc(place.why)}"</p>` : ""}

          <section class="bl-section">
            <h4>❤️ Our Excitement</h4>
            <div class="bl-exc-grid">
              <div><span class="bl-person-label">Me</span>${heartsRow(place.excitement.me, 19, true, "detail-me")}</div>
              <div><span class="bl-person-label">Ayoshy</span>${heartsRow(place.excitement.her, 19, true, "detail-her")}</div>
              <div class="bl-combined-box"><span class="bl-person-label">Together</span><strong>${combined || "–"}/5 ❤️</strong></div>
            </div>
          </section>

          ${place.status === "visited" ? `
          <section class="bl-section bl-memory-box">
            <h4>📸 Our Memory</h4>
            <label class="bl-field"><span>Date</span><input type="date" id="m-date" value="${esc(md.date)}" /></label>
            <label class="bl-field"><span>Short memory</span><textarea id="m-note" rows="2" placeholder="What do you want to remember about this?">${esc(md.note)}</textarea></label>
            <div class="bl-field">
              <span>Photos</span>
              <div class="bl-memory-photos-grid">
                ${photos.map((src, i) => `
                  <div class="bl-memory-photo-thumb" style="background-image:url('${esc(src)}');">
                    <button type="button" class="bl-photo-remove-btn" data-action="remove-memory-photo" data-index="${i}" aria-label="Remove photo">✕</button>
                  </div>`).join("")}
                <button type="button" class="bl-photo-add-tile" data-action="pick-memory-photos"><span style="font-size:17px;">📷</span><span>Add</span></button>
              </div>
              <input type="file" id="m-photo-file" accept="image/*" multiple style="display:none" />
            </div>
            <button class="bl-btn bl-btn-primary bl-btn-sm" data-action="save-memory" style="align-self:flex-start;">Save memory</button>
          </section>` : ""}

          <div class="bl-detail-actions">
            ${place.status !== "visited" ? `<button class="bl-btn bl-btn-primary" data-action="mark-visited" data-id="${place.id}">🎉 Mark as Visited</button>` : ""}
            <button class="bl-btn bl-btn-ghost" data-action="edit-place" data-id="${place.id}">✎ Edit</button>
            <button class="bl-btn bl-btn-danger bl-btn-outline" data-action="delete-place" data-id="${place.id}">🗑 Delete</button>
          </div>
        </div>
      </div>
    </div>`;
}

/* ================================================================ */
/*  Surprise modal                                                    */
/* ================================================================ */

function surpriseModal() {
  if (!state.showSurprise) return "";
  const pool = state.places.filter(p => p.status !== "visited");
  if (!pool.length) {
    return `
      <div class="bl-overlay" data-action="close-surprise">
        <div class="bl-surprise" data-stop="1">
          <button class="bl-close-btn" data-action="close-surprise" style="position:absolute;top:12px;right:12px;">✕</button>
          <p>Add a place first, then let us surprise you. ❤️</p>
        </div>
      </div>`;
  }
  const display = state.places.find(p => p.id === state.surpriseDisplayId) || pool[0];
  return `
    <div class="bl-overlay" data-action="close-surprise">
      <div class="bl-surprise" data-stop="1">
        <button class="bl-close-btn" data-action="close-surprise" style="position:absolute;top:12px;right:12px;">✕</button>
        <p class="bl-surprise-label">${state.surpriseSpinning ? "Deciding..." : "Tonight we're going to..."}</p>
        <div class="bl-surprise-reveal ${state.surpriseSpinning ? "is-spinning" : "is-settled"}">
          ${photoDiv(display, "bl-surprise-photo")}
          <h2>${esc(display.name)} ❤️</h2>
          <p class="bl-surprise-loc">${esc(display.location)}</p>
        </div>
        ${(!state.surpriseSpinning && state.surpriseResultId) ? `
          <div class="bl-surprise-actions">
            <button class="bl-btn bl-btn-primary" data-action="view-surprise-result">View place</button>
            <button class="bl-btn bl-btn-ghost" data-action="close-surprise">Maybe next time</button>
          </div>` : ""}
      </div>
    </div>`;
}

/* ================================================================ */
/*  Confirm delete + toast                                            */
/* ================================================================ */

function confirmModal() {
  if (!state.confirmDeleteId) return "";
  return `
    <div class="bl-overlay" data-action="cancel-delete">
      <div class="bl-confirm" data-stop="1">
        <p class="bl-confirm-title">Remove this place?</p>
        <p class="bl-confirm-body">This can't be undone.</p>
        <div class="bl-confirm-actions">
          <button class="bl-btn bl-btn-ghost" data-action="cancel-delete">Cancel</button>
          <button class="bl-btn bl-btn-danger" data-action="confirm-delete">Delete</button>
        </div>
      </div>
    </div>`;
}
function toastEl() {
  if (!state.toast) return "";
  return `<div class="bl-toast">${esc(state.toast)}</div>`;
}

/* ================================================================ */
/*  Targeted rendering                                                */
/*  Each slot is redrawn independently so that, for example, opening  */
/*  a memory's detail view never touches (and never re-initializes)   */
/*  the map underneath it.                                            */
/* ================================================================ */

function mountApp() {
  const root = document.getElementById("root");
  root.innerHTML = `
    <div id="nav-top-slot"></div>
    <main class="bl-main" id="main-slot"></main>
    <div id="nav-bottom-slot"></div>
    <button class="bl-fab" data-action="open-add" aria-label="Add a place">+</button>
    <div id="modal-slot"></div>
    <div id="toast-slot"></div>
  `;
  renderNav();
  renderMain();
  renderModals();
  renderToast();
}

function renderNav() {
  const top = document.getElementById("nav-top-slot");
  const bottom = document.getElementById("nav-bottom-slot");
  if (top) top.innerHTML = topNav();
  if (bottom) bottom.innerHTML = bottomNav();
}

function renderMain() {
  const slot = document.getElementById("main-slot");
  if (!slot) return;
  let page = "";
  if (state.view === "home") page = pageHome();
  else if (state.view === "wishlist") page = pageWishlist();
  else if (state.view === "map") page = pageMap();
  else if (state.view === "memories") page = pageMemories();
  slot.innerHTML = page;

  // Only (re)focus the search input if it exists — it only exists in the
  // DOM once the person has explicitly tapped the search icon, so this
  // never steals focus or opens the keyboard unexpectedly.
  const searchInput = document.getElementById("search-input");
  if (searchInput) {
    searchInput.focus();
    const val = searchInput.value;
    searchInput.value = "";
    searchInput.value = val;
  }
}

function renderModals() {
  const slot = document.getElementById("modal-slot");
  if (!slot) return;
  slot.innerHTML = addModal() + editModal() + detailModal() + surpriseModal() + confirmModal();
}

function renderToast() {
  const slot = document.getElementById("toast-slot");
  if (slot) slot.innerHTML = toastEl();
}

/* ================================================================ */
/*  Actions                                                            */
/* ================================================================ */

function openAdd() {
  state.formDraft = seedPlace({
    palette: state.places.length % PALETTES.length,
    mapPos: { x: 40 + Math.random() * 20, y: 40 + Math.random() * 20 },
  });
  state.showAdd = true;
  renderModals();
}
function openEdit(id) {
  const place = state.places.find(p => p.id === id);
  if (!place) return;
  state.formDraft = JSON.parse(JSON.stringify(place));
  state.editingId = id;
  state.selectedId = null;
  renderModals();
}
function closeModal() {
  state.showAdd = false;
  state.editingId = null;
  state.formDraft = null;
  renderModals();
}
function saveNew() {
  syncFormDraftFromInputs();
  const f = state.formDraft;
  if (!f.name.trim() || !f.location.trim()) return;
  const list = state.places.concat([Object.assign({}, f, { id: uid(), createdAt: new Date().toISOString() })]);
  persist(list);
  closeModal();
  renderMain();
  showToast("Added to our list ❤️");
}
function saveEdit() {
  syncFormDraftFromInputs();
  const f = state.formDraft;
  if (!f.name.trim() || !f.location.trim()) return;
  const list = state.places.map(p => p.id === f.id ? f : p);
  persist(list);
  closeModal();
  renderMain();
  showToast("Place updated");
}
function syncFormDraftFromInputs() {
  const f = state.formDraft;
  const nameEl = document.getElementById("f-name");
  if (!nameEl) return;
  f.name = document.getElementById("f-name").value;
  f.location = document.getElementById("f-location").value;
  f.category = document.getElementById("f-category").value;
  f.status = document.getElementById("f-status").value;
  f.why = document.getElementById("f-why").value;
}

function openPlace(id) {
  state.selectedId = id;
  const place = state.places.find(p => p.id === id);
  state.memoryDraft = place ? JSON.parse(JSON.stringify(place.memory)) : null;
  // Only the modal layer redraws — the page behind it (map, wishlist, etc.)
  // is left completely untouched, so opening a memory location is instant.
  renderModals();
}
function closeDetail() {
  state.selectedId = null;
  state.memoryDraft = null;
  renderMain();
  renderModals();
}

function requestDelete(id) {
  state.confirmDeleteId = id;
  renderModals();
}
function cancelDelete() {
  state.confirmDeleteId = null;
  renderModals();
}
function confirmDelete() {
  const id = state.confirmDeleteId;
  const list = state.places.filter(p => p.id !== id);
  persist(list);
  state.confirmDeleteId = null;
  if (state.selectedId === id) state.selectedId = null;
  renderMain();
  renderModals();
  showToast("Place removed");
}

function markVisited(id) {
  const place = state.places.find(p => p.id === id);
  if (!place) return;
  const today = new Date().toISOString().slice(0, 10);
  const updated = Object.assign({}, place, {
    status: "visited",
    visitedDate: place.visitedDate || today,
    memory: Object.assign({}, place.memory, { date: place.memory.date || today }),
  });
  const list = state.places.map(p => p.id === id ? updated : p);
  persist(list);
  state.memoryDraft = JSON.parse(JSON.stringify(updated.memory));
  renderModals();
  showToast("Marked as visited! 🎉");
}

function saveMemory() {
  const place = state.places.find(p => p.id === state.selectedId);
  if (!place) return;
  const date = document.getElementById("m-date").value;
  const note = document.getElementById("m-note").value;
  const updated = Object.assign({}, place, { memory: Object.assign({}, place.memory, { date, note }) });
  const list = state.places.map(p => p.id === place.id ? updated : p);
  persist(list);
  showToast("Memory saved ❤️");
}

function setHeart(group, value) {
  if (group === "form-me" || group === "form-her") {
    const key = group === "form-me" ? "me" : "her";
    const f = state.formDraft;
    const current = f.excitement[key];
    f.excitement = Object.assign({}, f.excitement, { [key]: (current === value ? 0 : value) });
    syncFormDraftFromInputs();
    renderModals();
  } else if (group === "detail-me" || group === "detail-her") {
    const key = group === "detail-me" ? "me" : "her";
    const place = state.places.find(p => p.id === state.selectedId);
    if (!place) return;
    const current = place.excitement[key];
    const updated = Object.assign({}, place, { excitement: Object.assign({}, place.excitement, { [key]: (current === value ? 0 : value) }) });
    const list = state.places.map(p => p.id === place.id ? updated : p);
    persist(list);
    renderModals();
  }
}

function setFormType(value) {
  state.formDraft.type = value;
  syncFormDraftFromInputs();
  renderModals();
}

function goHome_setView(view, tab) {
  state.view = view;
  if (tab) state.tab = tab;
  state.searchOpen = false;
  state.search = "";
  renderNav();
  renderMain();
}

function openSurprise() {
  const pool = state.places.filter(p => p.status !== "visited");
  state.showSurprise = true;
  state.surpriseSpinning = true;
  state.surpriseResultId = null;
  if (!pool.length) { renderModals(); return; }
  state.surpriseDisplayId = pool[Math.floor(Math.random() * pool.length)].id;
  renderModals();
  let count = 0;
  clearInterval(surpriseInterval);
  surpriseInterval = setInterval(() => {
    count += 1;
    state.surpriseDisplayId = pool[Math.floor(Math.random() * pool.length)].id;
    if (count > 13) {
      clearInterval(surpriseInterval);
      const final = pool[Math.floor(Math.random() * pool.length)];
      state.surpriseDisplayId = final.id;
      state.surpriseResultId = final.id;
      state.surpriseSpinning = false;
    }
    renderModals();
  }, 110);
}
function closeSurprise() {
  clearInterval(surpriseInterval);
  state.showSurprise = false;
  renderModals();
}
function viewSurpriseResult() {
  const id = state.surpriseResultId;
  closeSurprise();
  if (id) openPlace(id);
}

function toggleSearch() {
  state.searchOpen = true;
  renderMain();
}
function closeSearch() {
  state.searchOpen = false;
  state.search = "";
  renderMain();
}

/* ================================================================ */
/*  Photo upload actions                                              */
/* ================================================================ */

function pickCoverPhoto() {
  syncFormDraftFromInputs();
  const input = document.getElementById("f-photo-file");
  if (input) input.click();
}
function removeCoverPhoto() {
  syncFormDraftFromInputs();
  state.formDraft.photo = "";
  renderModals();
}
function pickMemoryPhotos() {
  const input = document.getElementById("m-photo-file");
  if (input) input.click();
}
function removeMemoryPhoto(index) {
  const place = state.places.find(p => p.id === state.selectedId);
  if (!place) return;
  const photos = (place.memory.photos || []).slice();
  photos.splice(index, 1);
  const updated = Object.assign({}, place, { memory: Object.assign({}, place.memory, { photos }) });
  const list = state.places.map(p => p.id === place.id ? updated : p);
  state.memoryDraft = Object.assign({}, state.memoryDraft, { photos });
  persist(list);
  renderModals();
}

async function handleCoverPhotoFile(file) {
  if (!file) return;
  try {
    const dataUrl = await readAndCompressImage(file, 1000, 0.78);
    syncFormDraftFromInputs();
    state.formDraft.photo = dataUrl;
    renderModals();
  } catch (e) {
    showToast("Couldn't load that photo");
  }
}
async function handleMemoryPhotoFiles(files) {
  const list = Array.from(files || []);
  if (!list.length) return;
  const place = state.places.find(p => p.id === state.selectedId);
  if (!place) return;
  try {
    const dataUrls = await Promise.all(list.map(f => readAndCompressImage(f, 1000, 0.75)));
    const photos = (place.memory.photos || []).concat(dataUrls);
    state.memoryDraft = Object.assign({}, state.memoryDraft, { photos });
    const updated = Object.assign({}, place, { memory: Object.assign({}, place.memory, { photos }) });
    const updatedList = state.places.map(p => p.id === place.id ? updated : p);
    await persist(updatedList);
    renderModals();
    showToast("Photo added ❤️");
  } catch (e) {
    showToast("Couldn't load those photos");
  }
}

/* ================================================================ */
/*  Event delegation                                                  */
/* ================================================================ */

document.addEventListener("click", (e) => {
  const stopEl = e.target.closest("[data-stop]");
  const actionEl = e.target.closest("[data-action]");
  if (!actionEl) return;
  // If the click originated inside a "stop" boundary (e.g. modal content) but the
  // matched action lives outside that boundary (e.g. the overlay's close action),
  // ignore it — otherwise clicking blank space inside a modal closes it.
  if (stopEl && actionEl.contains(stopEl) && actionEl !== stopEl) return;
  const action = actionEl.getAttribute("data-action");
  const id = actionEl.getAttribute("data-id");

  switch (action) {
    case "open-add": e.stopPropagation(); openAdd(); break;
    case "close-modal": e.stopPropagation(); closeModal(); break;
    case "save-new": e.stopPropagation(); saveNew(); break;
    case "save-edit": e.stopPropagation(); saveEdit(); break;
    case "open-place": e.stopPropagation(); openPlace(id); break;
    case "close-detail": e.stopPropagation(); closeDetail(); break;
    case "edit-place": e.stopPropagation(); openEdit(id); break;
    case "delete-place": e.stopPropagation(); requestDelete(id); break;
    case "cancel-delete": e.stopPropagation(); cancelDelete(); break;
    case "confirm-delete": e.stopPropagation(); confirmDelete(); break;
    case "mark-visited": e.stopPropagation(); markVisited(id); break;
    case "save-memory": e.stopPropagation(); saveMemory(); break;
    case "set-heart": {
      e.stopPropagation();
      const group = actionEl.getAttribute("data-group");
      const value = parseInt(actionEl.getAttribute("data-value"), 10);
      setHeart(group, value);
      break;
    }
    case "form-set-type": e.stopPropagation(); setFormType(actionEl.getAttribute("data-value")); break;
    case "set-view": e.stopPropagation(); goHome_setView(actionEl.getAttribute("data-view")); break;
    case "goto-wishlist": e.stopPropagation(); goHome_setView("wishlist", actionEl.getAttribute("data-tab")); break;
    case "set-tab": e.stopPropagation(); state.tab = actionEl.getAttribute("data-tab"); renderMain(); break;
    case "toggle-search": e.stopPropagation(); toggleSearch(); break;
    case "close-search": e.stopPropagation(); closeSearch(); break;
    case "open-surprise": e.stopPropagation(); openSurprise(); break;
    case "close-surprise": e.stopPropagation(); closeSurprise(); break;
    case "view-surprise-result": e.stopPropagation(); viewSurpriseResult(); break;
    case "pick-cover-photo": e.stopPropagation(); pickCoverPhoto(); break;
    case "remove-cover-photo": e.stopPropagation(); removeCoverPhoto(); break;
    case "pick-memory-photos": e.stopPropagation(); pickMemoryPhotos(); break;
    case "remove-memory-photo": e.stopPropagation(); removeMemoryPhoto(parseInt(actionEl.getAttribute("data-index"), 10)); break;
    default: break;
  }
});

document.addEventListener("input", (e) => {
  if (e.target.id === "search-input") {
    state.search = e.target.value;
    renderMain();
  }
});

document.addEventListener("change", (e) => {
  if (e.target && e.target.id === "f-photo-file") {
    const file = e.target.files && e.target.files[0];
    handleCoverPhotoFile(file);
    e.target.value = "";
  }
  if (e.target && e.target.id === "m-photo-file") {
    const files = e.target.files;
    handleMemoryPhotoFiles(files);
    e.target.value = "";
  }
});

/* ================================================================ */
/*  Boot                                                               */
/* ================================================================ */

document.getElementById("root").innerHTML = `<div class="bl-loading"><div class="bl-loading-heart">❤️</div><p>Loading our list...</p></div>`;
loadPlaces();
</script>
